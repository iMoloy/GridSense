<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Typographic "G" Monogram -->
  <text 
    x="50%" 
    y="56%" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="34" 
    font-weight="900" 
    fill="url(#textGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-1"
  >
    G
  </text>

  <!-- Micro Energy Pulse Node in upper right corner of monogram -->
  <circle cx="46" cy="18" r="3.5" fill="#10B981" />
  <circle cx="46" cy="18" r="5.5" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
</svg>
